<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GRIMWOLD 0.6</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#11150f;color:#eee5cc;font-family:system-ui,Arial}#app{height:100dvh;display:flex;flex-direction:column;background:#171c13}header{height:42px;flex-shrink:0;background:#252c1e;border-bottom:2px solid #46533a;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-weight:900;letter-spacing:1.5px;color:#c9bd8e}header small{font-size:10px;color:#9eaa85;letter-spacing:1px}#scene{position:relative;flex:1;min-height:0;overflow:hidden}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}.hud{position:absolute;left:8px;top:8px;width:min(230px,58vw);pointer-events:none;text-shadow:1px 1px 2px #000}.stats{font-size:10px;color:#e1d6bd;margin-bottom:4px}.bar{height:14px;background:#252821;border:1px solid #090b08;position:relative;margin:3px 0;box-shadow:0 1px 2px #000}.bar i{display:block;height:100%;transition:width .12s}.hp i{background:linear-gradient(#d65a4c,#8d2c27)}.mp i{background:linear-gradient(#5c9cd4,#285680)}.bar span{position:absolute;inset:0;text-align:center;font-size:9px;line-height:12px;font-weight:bold}.side{position:absolute;right:8px;top:8px;background:#151b13d9;border:1px solid #67724a;padding:7px 9px;font-size:10px;max-width:140px;color:#d6d0ad;pointer-events:none}.side b{color:#e5cf83;display:block;margin-bottom:3px}.toast{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);padding:9px 14px;background:#131b12ed;border:1px solid #c4b66c;display:none;font-size:12px;text-align:center;pointer-events:none;white-space:nowrap}.bottom{flex-shrink:0;background:#20261a;border-top:2px solid #45533a;padding:6px 7px 7px}.hotbar{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;max-width:560px;margin:auto}.slot{position:relative;aspect-ratio:1;max-height:56px;background:linear-gradient(135deg,#39402f,#252c20);border:2px solid #596348;display:grid;place-items:center;font-size:clamp(17px,5vw,26px);user-select:none;touch-action:manipulation}.slot:active{border-color:#dfca78;background:#51593e}.slot .key{position:absolute;top:1px;left:3px;font-size:9px;color:#d2d0b1}.slot .qty{position:absolute;right:2px;bottom:0;font-size:10px;text-shadow:1px 1px #000}.hint{text-align:center;font-size:9px;color:#8d987d;padding-top:3px}@media(min-width:700px){.slot{max-width:58px}.bottom{padding:8px}}

#rpgbtn{position:absolute;right:8px;bottom:8px;z-index:5;background:#8a713e;color:#f5e7bd;border:2px solid #d4bd79;border-radius:5px;padding:7px 10px;font-weight:bold;font-size:11px;box-shadow:0 2px 5px #000}
#rpgpanel{display:none;position:absolute;inset:8% 5%;z-index:10;background:#171d14f5;border:2px solid #7d8a5d;box-shadow:0 0 0 2px #242a1c,0 8px 30px #000;color:#eee5cc;padding:10px;overflow:auto;font-size:12px}
#rpgpanel h2{margin:0 0 8px;color:#d6c17c;font-size:18px}#rpgpanel button{background:#39432e;color:#f1e4c2;border:1px solid #8a986d;border-radius:3px;padding:6px;margin:3px;cursor:pointer}#rpgpanel .close{float:right;background:#713d35}#rpgpanel .tabs{display:flex;gap:3px;margin-bottom:8px}#rpgpanel .tabs button{flex:1}#rpgpanel .card{border:1px solid #536044;background:#22291c;padding:8px;margin:5px 0;border-radius:4px}#rpgpanel .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}#rpgpanel .item{display:flex;justify-content:space-between;align-items:center;gap:4px;border:1px solid #505c40;padding:5px;background:#2a3022}#rpgpanel .muted{color:#a6b18b;font-size:10px}#rpgpanel select,#rpgpanel input{background:#232b1e;color:#eee;border:1px solid #65754d;padding:5px}
@media(min-width:700px){#rpgpanel{inset:12% 20%}}
.slot{cursor:pointer}
</style></head><body><div id="app"><header><div>GRIMWOLD <small>0.6 · VISUAL CHARACTER</small></div><small>PIXEL MMORPG PROTOTYPE</small></header><div id="scene"><canvas id="world"></canvas><div class="hud"><div class="stats">WANDERER · LV <span id="lvl">1</span> · <span id="xp">0</span> XP · <span id="gold">0</span> G</div><div class="bar hp"><i id="hpbar"></i><span id="hptext">100 / 100 HP</span></div><div class="bar mp"><i id="mpbar"></i><span id="mptext">50 / 50 MP</span></div></div><div class="side"><b>✦ JOURNAL</b>Forest exploration<br><span id="quest">Slimes defeated: 0 / 3</span><br><span style="color:#91b77b">Tap ground to move · tap slime to fight</span></div><div class="toast" id="toast"></div></div><button id="rpgbtn" onclick="openRPG()">CHARACTER / BAG</button><div id="rpgpanel"><button class="close" onclick="closeRPG()">✕</button><h2>GRIMWOLD · CHARACTER</h2><div class="tabs"><button onclick="rpgTab('character')">Character</button><button onclick="rpgTab('inventory')">Inventory</button><button onclick="rpgTab('equipment')">Equipment</button></div><div id="rpgcontent"></div></div><div class="bottom"><div class="hotbar" id="hotbar"></div><div class="hint">Tap monster to engage · tap ground to move · hotbar 1–8</div></div></div>
<script>
(()=>{const cv=document.getElementById('world'),c=cv.getContext('2d');let vw=0,vh=0,dpr=1;const T=32,MW=90,MH=65;let camX=0,camY=0;const hero={x:880,y:720,tx:880,ty:720,hp:100,maxHp:100,mp:50,maxMp:50,level:1,xp:0,gold:0,atk:14,dead:false,walk:0,attackAnim:0,facing:1};let slimes=[{x:1190,y:680,hp:40,max:40,alive:true,respawn:0,cd:0},{x:1330,y:890,hp:40,max:40,alive:true,respawn:0,cd:0},{x:720,y:1050,hp:40,max:40,alive:true,respawn:0,cd:0},{x:1580,y:1160,hp:55,max:55,alive:true,respawn:0,cd:0}];let selected=null,kills=0,attackCd=0;let counts=[0,0,0,0,3,2,0,0];let skills=['🗡️','🔥','❄️','⚡','🧪','🧪','🛡️','💥'];const hb=document.getElementById('hotbar');skills.forEach((icon,i)=>{let el=document.createElement('div');el.className='slot';el.innerHTML=`<span class="key">${i+1}</span>${icon}<span class="qty">${counts[i]||''}</span>`;el.addEventListener('pointerdown',e=>{e.preventDefault();slot(i)});hb.appendChild(el)});
function resize(){let r=cv.getBoundingClientRect();vw=r.width;vh=r.height;dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.floor(vw*dpr);cv.height=Math.floor(vh*dpr);c.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();function rnd(x,y){let v=Math.sin(x*127.1+y*311.7)*43758.5453;return v-Math.floor(v)}function road(tx,ty){return (ty>19&&ty<23&&tx>5&&tx<47)||(tx>23&&tx<27&&ty>9&&ty<42)||(ty>36&&ty<40&&tx>23&&tx<65)}function kind(x,y){if(x<0||y<0||x>=MW||y>=MH)return'edge';if(x>18&&x<33&&y>12&&y<29)return'town';if(road(x,y))return'road';if((x>45&&y>27)||(x>55&&y>13))return'forest';return rnd(x,y)>.94?'flower':'grass'}function tile(x,y,k){let sx=x*T-camX,sy=y*T-camY;c.fillStyle=k==='road'?'#78684e':k==='town'?'#606d55':k==='forest'?'#315039':'#4b703e';c.fillRect(sx,sy,T,T);c.fillStyle=k==='road'?'#89785b':k==='town'?'#6c795e':'#557d43';c.fillRect(sx+1,sy+1,T-2,T-2);if(k==='grass'||k==='flower'){for(let n=0;n<4;n++){c.fillStyle=k==='flower'&&n===0?'#dfc773':'#3d6036';c.fillRect(sx+4+rnd(x+n,y)*24,sy+3+rnd(x,y+n)*24,2,4)}}if(k==='road'&&rnd(x,y)>.5){c.fillStyle='#655947';c.fillRect(sx+5,sy+8,3,3);c.fillRect(sx+24,sy+22,2,2)}}function house(x,y,w,h,roof,name){let px=x*T-camX,py=y*T-camY;c.fillStyle='#35362c';c.fillRect(px,py,w*T,h*T);c.fillStyle='#827660';c.fillRect(px+3,py+6,w*T-6,h*T-9);c.fillStyle=roof;c.fillRect(px+1,py+1,w*T-2,h*T*.42);c.fillStyle='#32281f';c.fillRect(px+w*T*.42,py+h*T*.56,w*T*.16,h*T*.44);c.fillStyle='#e2c986';c.font='bold 10px monospace';c.textAlign='center';c.fillText(name,px+w*T/2,py-4)}function tree(x,y){let px=x*T-camX,py=y*T-camY;c.fillStyle='#243a27';c.fillRect(px+13,py+20,7,13);c.fillStyle='#203d29';c.fillRect(px+3,py+5,26,23);c.fillStyle='#3b6840';c.fillRect(px+6,py+1,20,21);c.fillStyle='#5b8548';c.fillRect(px+9,py+4,12,12);c.fillStyle='#6f9352';c.fillRect(px+11,py+5,5,4)}function heroDraw(){let x=hero.x-camX,y=hero.y-camY,bob=Math.sin(hero.walk)*1.5,cls=(typeof rpg!=='undefined'?rpg.class:'Warrior'),gender=(typeof rpg!=='undefined'?rpg.gender:'Male'),eq=(typeof rpg!=='undefined'?rpg.equipment:{});let body=cls==='Mage'?'#604b9b':cls==='Archer'?'#3e7650':'#4d7190',trim=cls==='Mage'?'#c8a5ee':cls==='Archer'?'#b4cf7c':'#8d3431';c.fillStyle='#172018';c.fillRect(x-9,y+12,18,4);let legstep=Math.sin(hero.walk*1.5)*2;c.fillStyle='#9b9279';c.fillRect(x-7,y+8+bob,5,5+legstep);c.fillRect(x+2,y+8+bob,5,5-legstep);c.fillStyle=gender==='Female'?'#cda986':'#c6a982';c.fillRect(x-4,y-14+bob,8,8);c.fillStyle=gender==='Female'?'#6c3f2e':'#292b27';c.fillRect(x-6,y-17+bob,12,5);if(gender==='Female'){c.fillRect(x-7,y-14+bob,2,8);c.fillRect(x+5,y-14+bob,2,8)}c.fillStyle=body;c.fillRect(x-7,y-6+bob,14,15);c.fillStyle=trim;c.fillRect(x-4,y+1+bob,8,7);c.fillStyle='#b9b8a3';c.fillRect(x-8,y+9+bob,5,5);c.fillRect(x+3,y+9+bob,5,5);if(eq.armor){c.fillStyle='#b7b6a8';c.fillRect(x-8,y-6+bob,16,5);c.fillRect(x-7,y+1+bob,14,4)}if(eq.weapon||cls==='Warrior'||cls==='Archer'||cls==='Mage'){let armx=x+hero.facing*7,armY=y-4+bob;c.fillStyle='#c9c3a4';c.fillRect(armx-1,armY,4,7);if(cls==='Mage'){c.fillStyle='#8a6ad0';c.fillRect(armx+hero.facing*2,armY-9,3,12);c.fillStyle='#d4b6ff';c.fillRect(armx-1,armY-12,6,5)}else if(cls==='Archer'){c.strokeStyle='#d4b982';c.lineWidth=2;c.beginPath();c.arc(armx+hero.facing*4,armY-1,8,-1.2,1.2);c.stroke();c.fillStyle='#b7c78a';c.fillRect(armx+hero.facing*4,armY-10,2,19)}else{c.fillStyle='#8c8c94';c.fillRect(armx+hero.facing*2,armY-10,3,18);c.fillStyle='#d6d4ce';c.fillRect(armx+hero.facing*2-1,armY-10,5,3)}}if(hero.attackAnim>0){c.strokeStyle='#ffe58b';c.lineWidth=2;c.beginPath();c.arc(x+hero.facing*8,y-2,18,-.9,1.1);c.stroke();hero.attackAnim=Math.max(0,hero.attackAnim-.04)}}function slimeDraw(s){if(!s.alive)return;let x=s.x-camX,y=s.y-camY;c.fillStyle='#17291b';c.fillRect(x-13,y+8,26,4);c.fillStyle='#4b984f';c.fillRect(x-12,y-7,24,15);c.fillStyle='#77c96b';c.fillRect(x-7,y-10,14,7);c.fillStyle='#e5edc8';c.fillRect(x-6,y-2,4,4);c.fillRect(x+3,y-2,4,4);c.fillStyle='#233622';c.fillRect(x-5,y-1,2,2);c.fillRect(x+4,y-1,2,2);c.fillStyle='#172116';c.fillRect(x-15,y-19,30,4);c.fillStyle='#b64a3b';c.fillRect(x-14,y-18,28*(s.hp/s.max),2);if(selected===s){c.strokeStyle='#ffe08a';c.lineWidth=1;c.strokeRect(x-16,y-13,32,26)}}function draw(){c.clearRect(0,0,vw,vh);camX=Math.max(0,Math.min(hero.x-vw/2,MW*T-vw));camY=Math.max(0,Math.min(hero.y-vh/2,MH*T-vh));let sx=Math.floor(camX/T),sy=Math.floor(camY/T),ex=Math.ceil((camX+vw)/T),ey=Math.ceil((camY+vh)/T);for(let y=sy;y<=ey;y++)for(let x=sx;x<=ex;x++)tile(x,y,kind(x,y));house(20,15,4,3,'#5c4937','INN');house(27,15,3,3,'#71463c','SHOP');house(20,24,3,3,'#465b43','BANK');house(27,24,4,3,'#564b61','GUILD');for(let y=sy;y<ey;y++)for(let x=sx;x<ex;x++)if(kind(x,y)==='forest'&&rnd(x*2,y*2)>.45)tree(x,y);if(Math.hypot(hero.tx-hero.x,hero.ty-hero.y)>8){c.strokeStyle='#e9d99b';c.setLineDash([3,4]);c.beginPath();c.arc(hero.tx-camX,hero.ty-camY,5,0,Math.PI*2);c.stroke();c.setLineDash([])}slimes.forEach(slimeDraw);heroDraw();requestAnimationFrame(draw)}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',1400)}function hud(){document.getElementById('hpbar').style.width=hero.hp/hero.maxHp*100+'%';document.getElementById('hptext').textContent=Math.ceil(hero.hp)+' / '+hero.maxHp+' HP';document.getElementById('mpbar').style.width=hero.mp/hero.maxMp*100+'%';document.getElementById('mptext').textContent=Math.ceil(hero.mp)+' / '+hero.maxMp+' MP';document.getElementById('lvl').textContent=hero.level;document.getElementById('xp').textContent=hero.xp;document.getElementById('gold').textContent=hero.gold;document.getElementById('quest').textContent='Slimes defeated: '+kills+' / 3'}function move(x,y){hero.tx=Math.max(16,Math.min(MW*T-16,x));hero.ty=Math.max(16,Math.min(MH*T-16,y));selected=null}cv.addEventListener('pointerdown',e=>{let r=cv.getBoundingClientRect(),wx=e.clientX-r.left+camX,wy=e.clientY-r.top+camY;let mob=slimes.find(s=>s.alive&&Math.hypot(s.x-wx,s.y-wy)<27);if(mob){selected=mob;hero.tx=mob.x;hero.ty=mob.y;toast('Slime targeted')}else move(wx,wy)});function kill(s){s.alive=false;s.respawn=10;selected=null;kills++;hero.xp+=25;hero.gold+=4;toast('Slime defeated · +25 XP · +4 gold');let req=hero.level*100;if(hero.xp>=req){hero.xp-=req;hero.level++;hero.maxHp+=15;hero.maxMp+=10;hero.atk+=3;hero.hp=hero.maxHp;hero.mp=hero.maxMp;toast('LEVEL UP · '+hero.level)}hud()}function slot(i){if(i===4||i===5){if(counts[i]>0){counts[i]--;hero.hp=Math.min(hero.maxHp,hero.hp+35);hero.mp=Math.min(hero.maxMp,hero.mp+20);hb.children[i].querySelector('.qty').textContent=counts[i]||'';toast('Potion restored HP/MP');hud()}else toast('Potion empty');return}if(i===6){hero.mp=Math.min(hero.maxMp,hero.mp+8);toast('Guard stance · +8 MP');hud();return}if(!selected||!selected.alive){toast('Select a slime first');return}let range=i===0?55:175;if(Math.hypot(hero.x-selected.x,hero.y-selected.y)>range){toast('Move closer to target');return}if(i===0){selected.hp-=hero.atk;hero.attackAnim=1;toast('Sword hit · -'+hero.atk)}else if([1,2,3,7].includes(i)){if(hero.mp<15){toast('Not enough MP');return}hero.mp-=15;let dmg=i===1?30:i===2?22:i===3?36:45;selected.hp-=dmg;hero.attackAnim=1;toast('Skill hit · -'+dmg)}if(selected.hp<=0)kill(selected);hud()}window.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='8'){slot(+e.key-1);e.preventDefault()}});let last=performance.now();function update(t){let dt=Math.min((t-last)/1000,.05);last=t;let dx=hero.tx-hero.x,dy=hero.ty-hero.y,d=Math.hypot(dx,dy);if(d>2&&!hero.dead){hero.facing=dx>=0?1:-1;hero.x+=dx/d*Math.min(d,145*dt);hero.y+=dy/d*Math.min(d,145*dt);hero.walk+=dt*9}if(selected&&selected.alive){let dist=Math.hypot(hero.x-selected.x,hero.y-selected.y);if(dist>43){hero.tx=selected.x;hero.ty=selected.y}else{hero.tx=hero.x;hero.ty=hero.y;attackCd-=dt;if(attackCd<=0){selected.hp-=hero.atk;hero.attackAnim=1;attackCd=1.15;if(selected.hp<=0)kill(selected)}}}slimes.forEach(s=>{if(!s.alive){s.respawn-=dt;if(s.respawn<=0){s.alive=true;s.hp=s.max;toast('Slime respawned')}return}let md=Math.hypot(hero.x-s.x,hero.y-s.y);if(md<185){if(md>30){s.x+=(hero.x-s.x)/md*52*dt;s.y+=(hero.y-s.y)/md*52*dt}else{s.cd-=dt;if(s.cd<=0){hero.hp-=4;s.cd=1.35;toast('Slime attack · -4 HP');if(hero.hp<=0){hero.hp=0;hero.dead=true;selected=null;toast('You fell · returning to town');setTimeout(()=>{hero.x=880;hero.y=720;hero.tx=880;hero.ty=720;hero.hp=hero.maxHp;hero.dead=false;hud();toast('Returned to town')},2200)}}}}});hud();requestAnimationFrame(update)}hud();requestAnimationFrame(update);draw();})();

const rpgItems=[{id:'starter_sword',name:'Rusty sword',icon:'🗡️',type:'weapon',atk:4},{id:'leather',name:'Leather armor',icon:'🥋',type:'armor',def:3},{id:'boots',name:'Traveler boots',icon:'🥾',type:'boots',speed:5},{id:'health',name:'Health potion',icon:'🧪',type:'consumable',qty:3},{id:'mana',name:'Mana potion',icon:'🔵',type:'consumable',qty:2},{id:'herb',name:'Forest herb',icon:'🌿',type:'material',qty:4}];
let rpg={gender:'Male',class:'Warrior',name:'Wanderer',stats:{strength:5,agility:3,intelligence:2},equipment:{weapon:null,armor:null,boots:null},inventory:[...rpgItems]};
function saveRPG(){try{localStorage.setItem('grimwold_rpg05',JSON.stringify(rpg))}catch(e){}}
function openRPG(){document.getElementById('rpgpanel').style.display='block';rpgTab('character')}
function closeRPG(){document.getElementById('rpgpanel').style.display='none'}
function rpgTab(tab){let out=document.getElementById('rpgcontent');if(tab==='character'){out.innerHTML=`<div class="card"><label>Name <input id="charname" maxlength="16" value="${rpg.name}"></label><br><button onclick="setGender('Male')">♂ Male</button><button onclick="setGender('Female')">♀ Female</button><p>Appearance: <span class="muted">class-specific pixel sprite · gender styling · equipment visual preview on map</span></p><label>Class <select id="classpick" onchange="setClass(this.value)"><option>Warrior</option><option>Mage</option><option>Archer</option></select></label><button onclick="saveName()">Save character</button></div><div class="card"><b>${rpg.gender} ${rpg.class}</b><div class="grid"><div>❤️ HP: ${hero.maxHp}</div><div>🔵 MP: ${hero.maxMp}</div><div>⚔ Attack: ${hero.atk+ (rpg.equipment.weapon?.atk||0)}</div><div>🛡 Defense: ${rpg.stats.strength+(rpg.equipment.armor?.def||0)}</div><div>🏃 Speed: ${100+(rpg.equipment.boots?.speed||0)}%</div><div>⭐ Level: ${hero.level}</div></div></div>`;document.getElementById('classpick').value=rpg.class;document.getElementById('charname').value=rpg.name}
else if(tab==='inventory'){out.innerHTML='<div class="card"><b>Backpack</b><div class="muted">Click Equip on gear to wear it. Consumables are currently represented as inventory items.</div><div class="grid">'+rpg.inventory.map(it=>`<div class="item"><span>${it.icon} ${it.name}${it.qty?' ×'+it.qty:''}</span>${['weapon','armor','boots'].includes(it.type)?`<button onclick="equipItem('${it.id}')">Equip</button>`:''}</div>`).join('')+'</div></div>'}
else{out.innerHTML='<div class="card"><b>Equipment</b><div class="grid">'+['weapon','armor','boots'].map(slot=>`<div class="item"><span>${slot.toUpperCase()}: ${rpg.equipment[slot]?rpg.equipment[slot].icon+' '+rpg.equipment[slot].name:'Empty'}</span>${rpg.equipment[slot]?`<button onclick="unequip('${slot}')">Remove</button>`:''}</div>`).join('')+'</div></div>'}saveRPG()}
function setGender(g){rpg.gender=g;rpgTab('character');saveRPG()}function setClass(v){rpg.class=v;rpgTab('character');saveRPG()}function saveName(){let v=document.getElementById('charname').value.trim();if(v)rpg.name=v;toast('Character saved');saveRPG();rpgTab('character')}
function equipItem(id){let it=rpg.inventory.find(x=>x.id===id);if(!it)return;let slot=it.type;if(!['weapon','armor','boots'].includes(slot))return;let old=rpg.equipment[slot];if(old)rpg.inventory.push(old);rpg.equipment[slot]=it;rpg.inventory=rpg.inventory.filter(x=>x.id!==id);if(slot==='weapon'&&it.atk)hero.atk+=it.atk;toast(it.name+' equipped');saveRPG();rpgTab('inventory')}
function unequip(slot){let it=rpg.equipment[slot];if(it){rpg.inventory.push(it);if(slot==='weapon'&&it.atk)hero.atk-=it.atk;rpg.equipment[slot]=null;saveRPG();rpgTab('equipment')}}
try{let stored=localStorage.getItem('grimwold_rpg05');if(stored){let loaded=JSON.parse(stored);if(loaded&&loaded.inventory&&loaded.equipment){rpg=loaded;hero.atk=14+(rpg.equipment.weapon?.atk||0)}}}catch(e){}
</script></body></html>

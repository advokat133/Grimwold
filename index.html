<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GRIMWOLD 0.7</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#141a12;color:#e8dfc4;font-family:system-ui}#app{height:100dvh;display:flex;flex-direction:column}header{height:38px;flex:none;background:#252d1f;border-bottom:2px solid #4d5b3d;padding:7px 10px;font-size:12px;font-weight:900;letter-spacing:1.5px;display:flex;justify-content:space-between;color:#d5c68d}#scene{flex:1;min-height:0;position:relative}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}.hud{position:absolute;top:8px;left:8px;width:min(220px,56vw);pointer-events:none;text-shadow:1px 1px 2px #000;font-size:10px}.bar{height:15px;margin:3px 0;border:1px solid #080b08;background:#242921;position:relative}.bar i{height:100%;display:block}.hp i{background:#b74639}.mp i{background:#3277ad}.bar span{position:absolute;inset:0;text-align:center;font-size:9px;line-height:13px;font-weight:700}.quest{position:absolute;top:8px;right:8px;width:135px;background:#151b13e8;border:1px solid #6b7950;padding:8px;font-size:10px;pointer-events:none}.quest strong{display:block;color:#dfc879;margin-bottom:3px}.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#151b13ed;border:1px solid #c6b56d;padding:9px 13px;display:none;z-index:5;pointer-events:none;font-size:12px}.bottom{flex:none;background:#20271b;border-top:2px solid #4a5839;padding:5px 6px}.hotbar{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;max-width:600px;margin:auto}.slot{aspect-ratio:1;max-height:58px;position:relative;background:#323b2a;border:2px solid #59664a;display:grid;place-items:center;font-size:clamp(16px,5vw,25px);touch-action:manipulation;user-select:none;cursor:pointer}.slot:active{border-color:#e4cd7e;background:#515c3e}.key{position:absolute;left:2px;top:1px;font-size:8px;color:#c8c9a9}.qty{position:absolute;right:2px;bottom:0;font-size:10px;text-shadow:1px 1px #000}.hint{text-align:center;font-size:9px;color:#9da889;padding:3px 0 0}.menuBtn{position:absolute;bottom:5px;right:8px;z-index:4;background:#8c7444;border:2px solid #d4bf7b;color:#f7e9c4;font-weight:bold;padding:6px 9px;border-radius:4px;font-size:10px}#panel{display:none;position:absolute;inset:6% 5%;z-index:8;background:#182016f7;border:2px solid #7d8c5c;padding:10px;overflow:auto;font-size:12px;box-shadow:0 8px 28px #000}#panel h2{margin:0 0 8px;color:#e0ca7e}#panel button{background:#39452f;color:#efe2bd;border:1px solid #85976b;padding:6px;margin:3px;border-radius:3px}#panel .close{float:right;background:#713e34}#panel .box{background:#252e20;border:1px solid #586646;padding:8px;margin:5px 0}#panel input,#panel select{background:#263021;color:#fff;border:1px solid #75865a;padding:5px} @media(min-width:700px){.slot{max-width:60px}#panel{inset:12% 22%}}
</style></head><body><div id="app"><header><span>GRIMWOLD <small>0.7 · PLAYABLE TEST</small></span><span>PIXEL MMORPG</span></header><div id="scene"><canvas id="world"></canvas><div class="hud"><div>WANDERER · LV <b id="level">1</b> · <span id="xp">0</span> XP · <span id="gold">0</span> G</div><div class="bar hp"><i id="hpfill"></i><span id="hptext">100 / 100 HP</span></div><div class="bar mp"><i id="mpfill"></i><span id="mptext">50 / 50 MP</span></div></div><div class="quest"><strong>✦ JOURNAL</strong>Forest exploration<br><span id="questText">Slimes: 0 / 3</span><br><span style="color:#9fbd88">Tap ground to move</span></div><div id="toast" class="toast"></div><button class="menuBtn" id="menuBtn">CHARACTER / BAG</button><div id="panel"></div></div><div class="bottom"><div class="hotbar" id="hotbar"></div><div class="hint">Tap ground to move · tap slime to target · skills 1–8</div></div></div>
<script>
(()=>{const canvas=document.getElementById('world'),ctx=canvas.getContext('2d'),scene=document.getElementById('scene');let W,H,scale=1,camX=0,camY=0;const mapW=2200,mapH=1800,tile=48;const hero={x:510,y:620,tx:510,ty:620,hp:100,maxHp:100,mp:50,maxMp:50,level:1,xp:0,gold:0,atk:14,walk:0,face:1};let mobs=[{x:850,y:610,hp:40,max:40,alive:true,respawn:0,cd:0},{x:1000,y:830,hp:40,max:40,alive:true,respawn:0,cd:0},{x:720,y:1050,hp:40,max:40,alive:true,respawn:0,cd:0},{x:1320,y:1180,hp:55,max:55,alive:true,respawn:0,cd:0}];let target=null,kills=0,attackCooldown=0,inventory={potions:3};const icons=['🗡️','🔥','❄️','⚡','🧪','🧪','🛡️','💥'],hotbar=document.getElementById('hotbar');icons.forEach((ic,i)=>{let b=document.createElement('div');b.className='slot';b.innerHTML=`<span class="key">${i+1}</span>${ic}<span class="qty" id="q${i}">${i===4?3:i===5?2:''}</span>`;b.addEventListener('pointerdown',e=>{e.preventDefault();useSlot(i)});hotbar.appendChild(b)});function resize(){let r=canvas.getBoundingClientRect();W=r.width;H=r.height;scale=Math.min(2,devicePixelRatio||1);canvas.width=W*scale;canvas.height=H*scale;ctx.setTransform(scale,0,0,scale,0,0)}window.addEventListener('resize',resize);resize();function hash(a,b){let v=Math.sin(a*127.1+b*311.7)*43758.545;return v-Math.floor(v)}function inTown(x,y){return x>280&&x<980&&y>300&&y<930}function drawTile(x,y){let px=x*tile-camX,py=y*tile-camY;let town=inTown(x*tile,y*tile),forest=(x*tile>1150||y*tile>1150);ctx.fillStyle=town?'#69775d':forest?'#34543a':'#4c713e';ctx.fillRect(px,py,tile,tile);ctx.fillStyle=town?'#748267':forest?'#3b6141':'#567b45';ctx.fillRect(px+2,py+2,tile-4,tile-4);if(!town&&hash(x,y)>.65){ctx.fillStyle=forest?'#28462f':'#3e6037';for(let i=0;i<3;i++)ctx.fillRect(px+hash(x+i,y)*tile,py+hash(x,y+i)*tile,3,5)}if(forest&&hash(x+4,y+7)>.72)tree(px,py)}function tree(px,py){ctx.fillStyle='#243d29';ctx.fillRect(px+20,py+30,8,14);ctx.fillStyle='#23422b';ctx.fillRect(px+7,py+9,35,32);ctx.fillStyle='#3c6b43';ctx.fillRect(px+11,py+4,27,28);ctx.fillStyle='#5b8650';ctx.fillRect(px+16,py+10,13,12)}function house(x,y,w,h,roof,label){let px=x-camX,py=y-camY;ctx.fillStyle='#36362c';ctx.fillRect(px,py,w,h);ctx.fillStyle='#817763';ctx.fillRect(px+5,py+10,w-10,h-12);ctx.fillStyle=roof;ctx.fillRect(px+2,py+2,w-4,h*.38);ctx.fillStyle='#33271f';ctx.fillRect(px+w*.43,py+h*.55,w*.14,h*.45);ctx.fillStyle='#e3cf8a';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText(label,px+w/2,py-5)}function drawHero(){let x=hero.x-camX,y=hero.y-camY,b=Math.sin(hero.walk)*2;ctx.fillStyle='#182319';ctx.fillRect(x-10,y+14,20,4);ctx.fillStyle='#9a9279';ctx.fillRect(x-7,y+9+b,5,7);ctx.fillRect(x+2,y+9-b,5,7);ctx.fillStyle='#c9a982';ctx.fillRect(x-5,y-13+b,10,10);ctx.fillStyle='#2d2e27';ctx.fillRect(x-7,y-17+b,14,5);ctx.fillStyle='#4e7392';ctx.fillRect(x-8,y-4+b,16,16);ctx.fillStyle='#913d34';ctx.fillRect(x-4,y+1+b,8,8);ctx.fillStyle='#b8b7a7';ctx.fillRect(x-8,y+10+b,5,5);ctx.fillRect(x+3,y+10+b,5,5);ctx.fillStyle='#d6d3c8';ctx.fillRect(x+hero.face*10,y-5+b,3,16);ctx.fillStyle='#85858a';ctx.fillRect(x+hero.face*10-1,y-8+b,5,4)}function drawMob(m){if(!m.alive)return;let x=m.x-camX,y=m.y-camY;ctx.fillStyle='#15251a';ctx.fillRect(x-14,y+9,28,4);ctx.fillStyle='#4d9952';ctx.fillRect(x-13,y-6,26,16);ctx.fillStyle='#7ac76c';ctx.fillRect(x-8,y-10,16,7);ctx.fillStyle='#f0efc9';ctx.fillRect(x-6,y-2,4,4);ctx.fillRect(x+3,y-2,4,4);ctx.fillStyle='#222';ctx.fillRect(x-5,y-1,2,2);ctx.fillRect(x+4,y-1,2,2);ctx.fillStyle='#251c18';ctx.fillRect(x-16,y-19,32,4);ctx.fillStyle='#b74d3d';ctx.fillRect(x-15,y-18,30*(m.hp/m.max),2);if(target===m){ctx.strokeStyle='#ffe18a';ctx.strokeRect(x-17,y-13,34,27)}}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',1500)}function updateHUD(){for(let [id,val] of [['hpfill',hero.hp/hero.maxHp*100],['mpfill',hero.mp/hero.maxMp*100]])document.getElementById(id).style.width=val+'%';document.getElementById('hptext').textContent=Math.ceil(hero.hp)+' / '+hero.maxHp+' HP';document.getElementById('mptext').textContent=Math.ceil(hero.mp)+' / '+hero.maxMp+' MP';document.getElementById('level').textContent=hero.level;document.getElementById('xp').textContent=hero.xp;document.getElementById('gold').textContent=hero.gold;document.getElementById('questText').textContent='Slimes defeated: '+kills+' / 3'}function moveTo(x,y){hero.tx=Math.max(30,Math.min(mapW-30,x));hero.ty=Math.max(30,Math.min(mapH-30,y));target=null}canvas.addEventListener('pointerdown',e=>{let r=canvas.getBoundingClientRect(),x=e.clientX-r.left+camX,y=e.clientY-r.top+camY,m=mobs.find(z=>z.alive&&Math.hypot(z.x-x,z.y-y)<35);if(m){target=m;hero.tx=m.x;hero.ty=m.y;toast('Target selected')}else moveTo(x,y)});function kill(m){m.alive=false;m.respawn=12;target=null;kills++;hero.xp+=25;hero.gold+=4;toast('Slime defeated · +25 XP · +4 G');let need=hero.level*100;if(hero.xp>=need){hero.xp-=need;hero.level++;hero.maxHp+=15;hero.maxMp+=10;hero.atk+=3;hero.hp=hero.maxHp;hero.mp=hero.maxMp;toast('LEVEL UP! '+hero.level)}updateHUD()}function useSlot(i){if(i===4||i===5){if(inventory.potions<=0){toast('No potions left');return}inventory.potions--;hero.hp=Math.min(hero.maxHp,hero.hp+35);hero.mp=Math.min(hero.maxMp,hero.mp+20);document.getElementById('q4').textContent=inventory.potions||'';toast('Potion: +HP / +MP');updateHUD();return}if(i===6){hero.mp=Math.min(hero.maxMp,hero.mp+10);toast('Guard: restored 10 MP');updateHUD();return}if(!target||!target.alive){toast('Tap a slime first');return}let dist=Math.hypot(hero.x-target.x,hero.y-target.y),cost=i===0?0:15;if(dist>165){toast('Get closer to target');return}if(hero.mp<cost){toast('Not enough MP');return}hero.mp-=cost;let damage=i===0?hero.atk:i===1?30:i===2?22:i===3?36:45;target.hp-=damage;toast((i===0?'Basic attack':'Skill')+' · -'+damage);if(target.hp<=0)kill(target);updateHUD()}window.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='8'){useSlot(Number(e.key)-1);e.preventDefault()}});let last=performance.now();function tick(now){let dt=Math.min((now-last)/1000,.05);last=now;let dx=hero.tx-hero.x,dy=hero.ty-hero.y,d=Math.hypot(dx,dy);if(d>2){hero.face=dx>=0?1:-1;let step=Math.min(d,150*dt);hero.x+=dx/d*step;hero.y+=dy/d*step;hero.walk+=dt*9}if(target&&target.alive){let dist=Math.hypot(hero.x-target.x,hero.y-target.y);if(dist>42){hero.tx=target.x;hero.ty=target.y}else{hero.tx=hero.x;hero.ty=hero.y;attackCooldown-=dt;if(attackCooldown<=0){target.hp-=hero.atk;attackCooldown=1.1;if(target.hp<=0)kill(target)}}}mobs.forEach(m=>{if(!m.alive){m.respawn-=dt;if(m.respawn<=0){m.alive=true;m.hp=m.max;toast('Slime respawned')}return}let md=Math.hypot(hero.x-m.x,hero.y-m.y);if(md<190){if(md>32){m.x+=(hero.x-m.x)/md*48*dt;m.y+=(hero.y-m.y)/md*48*dt}else{m.cd-=dt;if(m.cd<=0){hero.hp-=4;m.cd=1.4;if(hero.hp<=0){hero.hp=0;toast('Defeated · back to town');target=null;hero.tx=510;hero.ty=620;setTimeout(()=>{hero.x=hero.y=510;hero.hp=hero.maxHp;updateHUD()},1600)}}}}});updateHUD();requestAnimationFrame(tick)}function render(){camX=Math.max(0,Math.min(hero.x-W/2,mapW-W));camY=Math.max(0,Math.min(hero.y-H/2,mapH-H));ctx.clearRect(0,0,W,H);let x0=Math.floor(camX/tile),y0=Math.floor(camY/tile),x1=Math.ceil((camX+W)/tile),y1=Math.ceil((camY+H)/tile);for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)drawTile(x,y);house(360,390,180,145,'#67513c','INN');house(600,390,155,145,'#71443b','SHOP');house(360,680,150,135,'#4c6348','BANK');house(610,680,185,135,'#554c62','GUILD');mobs.forEach(drawMob);drawHero();requestAnimationFrame(render)}
const panel=document.getElementById('panel');document.getElementById('menuBtn').onclick=()=>{panel.style.display=panel.style.display==='block'?'none':'block';showPanel()};function showPanel(){panel.innerHTML=`<button class="close" onclick="document.getElementById('panel').style.display='none'">Close ✕</button><h2>GRIMWOLD · CHARACTER</h2><div class="box"><label>Name <input id="pname" value="Wanderer" maxlength="16"></label><p>Class: <select id="class"><option>Warrior</option><option>Mage</option><option>Archer</option></select></p><button id="savechar">Save</button></div><div class="box"><b>Character stats</b><p>Level: ${hero.level} · XP: ${hero.xp}</p><p>❤️ HP ${hero.maxHp} · 🔵 MP ${hero.maxMp} · ⚔ Attack ${hero.atk}</p><p>🪙 Gold: ${hero.gold}</p></div><div class="box"><b>Bag</b><p>🧪 Potions: ${inventory.potions}</p><p>🗡️ Rusty sword · 🥋 Leather armor · 🌿 Forest herbs</p></div>`;document.getElementById('savechar').onclick=()=>toast('Character settings saved (demo)')}updateHUD();requestAnimationFrame(tick);requestAnimationFrame(render)})();
</script></body></html>
